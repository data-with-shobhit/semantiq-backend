  #     redis:    { condition: service_healthy }
  #     qdrant:   { condition: service_healthy }
  #   env_file: .env
  #   volumes:
  #     - ./storage:/app/storage
  #
  # worker-financial:
  #   build: .
  #   command: celery -A ingestion.tasks worker -Q financial -c 2 --loglevel=info
  #   depends_on:
  #     postgres: { condition: service_healthy }
  #     redis:    { condition: service_healthy }
  #     qdrant:   { condition: service_healthy }
  #   env_file: .env
  #   volumes:
  #     - ./storage:/app/storage
  #
