[project]
name = "rag-platform"
version = "0.1.0"
description = "Production-grade multi-tenant RAG platform"
requires-python = ">=3.13"
dependencies = [
    # API
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "python-multipart==0.0.9",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    # Auth
    "PyJWT==2.9.0",
    "passlib[bcrypt]==1.7.4",
    # Database
    "asyncpg>=0.30.0",
    # Vector store
    "qdrant-client==1.11.3",
    # Cache / broker
    "redis==5.0.8",
    "celery==5.4.0",
    # Embeddings
    "torch>=2.5.1",
    "transformers==4.46.3",
    "sentence-transformers==3.3.1",
    # Chunking
    "llama-index-core==0.12.2",
    "pypdf==4.3.1",
    "tree-sitter==0.23.1",
    "tree-sitter-python==0.23.2",
    # LLM
    "openai>=1.58.0",
    "ollama==0.3.3",
    # Retrieval / reranking
    "rank-bm25==0.2.2",
    # Orchestration
    "langgraph==0.2.28",
    "langsmith==0.1.129",
    # Observability
    "structlog==24.4.0",
    "prometheus-client==0.21.0",
    # Evaluation
    "ragas>=0.2.0",
    # Demo UI
    "streamlit==1.38.0",
    # Utilities
    "httpx==0.27.2",
    "tenacity>=8.2.0",
    "python-dotenv==1.0.1",
    "numpy>=2.0",
    "pyarrow>=14.0,<19",
    "jiter>=0.8",
    "unstructured[pdf]>=0.18.32",
    "langchain-openai>=0.2.2",
    "fastembed>=0.7.3",
    "tavily-python>=0.7.23",
    "pymupdf4llm>=1.27.2.3",
    "boto3>=1.42.96",
    "google-generativeai>=0.8.6",
    "python-docx>=1.2.0",
    "google-genai>=1.2.0",
    "requests>=2.33.1",
    "tiktoken>=0.12.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "cache*", "config*", "db*", "demo*", "eval*", "graph*", "ingestion*", "llm*", "monitoring*", "retrieval*", "storage*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["slow: downloads HuggingFace models (~400MB per model)"]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "fakeredis>=2.20.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
